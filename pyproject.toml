[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridscope"
version = "0.1.0"
description = "Normalized European electricity data and deterministic grid intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "pandas>=2.2,<4", "defusedxml>=0.7,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "mypy>=1.15", "pandas-stubs", "types-defusedxml"]
examples = ["matplotlib>=3.9", "jupyterlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires explicit opt-in and ENTSO-E credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP046", "UP047"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gridscope"]
